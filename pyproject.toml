[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "election-audit"
version = "0.1.0"
description = "Reproducible tooling for a partial TSE 2026 runoff log corpus"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb==1.5.3",
    "pyarrow==24.0.0",
]

[project.scripts]
election-audit = "election_audit.cli:main"

[project.optional-dependencies]
dashboard = [
    "altair==6.3.0",
    "marimo==0.25.0",
]
research = [
    "quantile-forest==1.4.2",
    "scikit-learn>=1.9.1",
]
verification = [
    "asn1tools>=0.169.0",
    "cryptography>=50.0.2",
    "ed521rs==0.1.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.0",
    "ty==0.0.94",
]

[tool.hatch.build.targets.wheel]
packages = ["election_audit", "scripts"]

[tool.uv]
exclude-newer = "2026-10-29T00:00:00Z"
# ed521rs 0.1.0 was published on 2026-11-07 (UTC), after the general cutoff.
exclude-newer-package = { ed521rs = "2026-11-08T00:00:00Z" }
build-constraint-dependencies = ["pluggy==1.6.0"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ANN", "E4", "E7", "E9", "F", "I"]
# Explicit Any is allowed where values are decoded ASN.1 or JSON.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Preserve the legacy worker callback while separating formatting from behavior.
"scripts/download_tse_logs.py" = ["E731"]
# marimo regenerates its cell functions; ty still checks them.
"election_audit/notebooks/*" = ["ANN"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["election_audit", "scripts", "tests"]
exclude = ["election_audit/notebooks/__marimo__"]

[tool.ty.terminal]
error-on-warning = true
